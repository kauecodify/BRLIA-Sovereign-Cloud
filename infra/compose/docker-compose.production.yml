# BRLIA Sovereign Cloud - Compose de Producao
# Complementa o docker-compose.yml da raiz para ambientes de producao:
#   docker compose -f docker-compose.yml -f infra/compose/docker-compose.production.yml up -d
# Toda senha/segredo deve ser injetado via environment real ou secrets.

services:
  control-api:
    environment:
      SERVER_MODE: release
      AUTH_ENABLED: "true"

  waterfall:
    environment:
      SERVER_MODE: release
      AUTH_ENABLED: "true"
      ENABLE_AI: "true"
      WORKER_COUNT: "50"
      QUEUE_WORKER_COUNT: "20"
