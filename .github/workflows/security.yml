name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  govulncheck:
    name: Vulnerability scan (govulncheck)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - services/control-api
          - services/waterfall
          - services/identity
          - services/compute
          - services/storage
          - services/network
          - services/security
          - services/billing
          - services/audit
          - services/ai-platform
          - services/hpc
          - services/quantum-broker
          - services/government
          - adapters/kubernetes
          - adapters/kvm
          - adapters/ceph
          - adapters/slurm
          - adapters/hsm
          - adapters/datacenter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        working-directory: ${{ matrix.module }}
        run: govulncheck ./...
